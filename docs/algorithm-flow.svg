<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Generalized maximum flow: finding a constriction and propagating the update</title>
  <desc>Four panels. A network with capacities and multipliers; the highest-gain path and its constricting edge; the reverse residual arc created by the push and the node labels it invalidates; and the repaired labels with the next constriction on a different edge.</desc>

  <rect fill="#ffffff" x="0" y="0" width="980" height="760"/>

  <defs>
    <marker id="h-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="h-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="h-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="h-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============================= PANEL 1 ============================= -->
  <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" x="16" y="16" width="464" height="336"/>
  <circle fill="#0f172a" cx="42" cy="44" r="11"/>
  <text font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle" x="42" y="48">1</text>
  <text font-size="15px" font-weight="650" fill="#0f172a" x="62" y="42">The network</text>
  <text font-size="11.5px" fill="#64748b" x="62" y="58">each edge carries capacity c and multiplier g</text>

  <!-- nodes: s(70,180) a(190,110) b(190,250) t(400,180) -->
  <g>
    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="96" y1="172" x2="166" y2="118" marker-end="url(#h-grey)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="124" y="133">c 10 · g 1.0</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="96" y1="188" x2="166" y2="242" marker-end="url(#h-grey)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="124" y="236">c 10 · g 1.0</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="214" y1="110" x2="376" y2="170" marker-end="url(#h-grey)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="296" y="126">c 4 · g 0.5</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="214" y1="250" x2="376" y2="190" marker-end="url(#h-grey)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="296" y="243">c 9 · g 0.6</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="190" y1="134" x2="190" y2="226" marker-end="url(#h-grey)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="190" y="184">c 5 · g 0.9</text>

    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="70" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="70" y="185">s</text>
    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="190" cy="110" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="115">a</text>
    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="190" cy="250" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="255">b</text>
    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="400" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="400" y="185">t</text>
  </g>

  <text font-size="11.5px" fill="#334155" x="36" y="300">A unit entering s→a→t arrives as 0.5; through s→b→t as 0.6.</text>
  <text font-size="11.5px" fill="#334155" x="36" y="320">Gain is a product along the path, so the search works on</text>
  <text font-size="11.5px" fill="#334155" x="36" y="338">−log g, where highest gain is exactly shortest distance.</text>

  <!-- ============================= PANEL 2 ============================= -->
  <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" x="500" y="16" width="464" height="336"/>
  <circle fill="#0f172a" cx="526" cy="44" r="11"/>
  <text font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle" x="526" y="48">2</text>
  <text font-size="15px" font-weight="650" fill="#0f172a" x="546" y="42">Find the constriction</text>
  <text font-size="11.5px" fill="#64748b" x="546" y="58">bottleneck = min over edges of residual ÷ gain-so-far</text>

  <g transform="translate(484,0)">
    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="96" y1="172" x2="166" y2="118" marker-end="url(#h-faint)"/>
    <line stroke="#0f172a" stroke-width="3.2" fill="none" x1="96" y1="188" x2="166" y2="242" marker-end="url(#h-dark)"/>
    <text font-size="10.5px" fill="#0f172a" font-weight="650" text-anchor="middle" x="118" y="236">10 ÷ 1 = 10</text>

    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="214" y1="110" x2="376" y2="170" marker-end="url(#h-faint)"/>
    <line stroke="#dc2626" stroke-width="3.6" fill="none" x1="214" y1="250" x2="376" y2="190" marker-end="url(#h-red)"/>
    <text font-size="10.5px" fill="#dc2626" font-weight="650" text-anchor="middle" x="300" y="247">9 ÷ 1 = 9  ← least</text>

    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="190" y1="134" x2="190" y2="226" marker-end="url(#h-faint)"/>

    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="70" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="70" y="185">s</text>
    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="190" cy="110" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="115">a</text>
    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="190" cy="250" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="255">b</text>
    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="400" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="400" y="185">t</text>
  </g>

  <text font-size="11.5px" fill="#0f172a" font-weight="650" x="520" y="300">s→b→t has gain 0.6, the highest available.</text>
  <text font-size="11.5px" fill="#334155" x="520" y="320">Push 9 units: b→t fills exactly and becomes the constricting</text>
  <text font-size="11.5px" fill="#334155" x="520" y="338">edge. 5.4 units arrive at t. Note 9, not 10 — b→t ran out first.</text>

  <!-- ============================= PANEL 3 ============================= -->
  <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" x="16" y="368" width="464" height="336"/>
  <circle fill="#0f172a" cx="42" cy="396" r="11"/>
  <text font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle" x="42" y="400">3</text>
  <text font-size="15px" font-weight="650" fill="#0f172a" x="62" y="394">The update fans out</text>
  <text font-size="11.5px" fill="#64748b" x="62" y="410">the push creates a reverse arc and stales the labels past it</text>

  <g transform="translate(0,352)">
    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="96" y1="172" x2="166" y2="118" marker-end="url(#h-grey)"/>
    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="96" y1="188" x2="166" y2="242" marker-end="url(#h-faint)"/>
    <text font-size="10.5px" fill="#475569" text-anchor="middle" x="112" y="238">1 left</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="214" y1="110" x2="376" y2="170" marker-end="url(#h-grey)"/>

    <!-- saturated forward b->t, plus its new reverse arc t->b -->
    <path stroke="#dc2626" stroke-width="3.6" fill="none" d="M 214 252 L 376 192" marker-end="url(#h-red)"/>
    <text font-size="10.5px" fill="#dc2626" font-weight="650" text-anchor="middle" x="300" y="252">full</text>
    <path stroke="#ea580c" stroke-width="2.6" fill="none" stroke-dasharray="6 4" d="M 374 174 C 320 150 268 198 216 234" marker-end="url(#h-orange)"/>
    <text font-size="10.5px" fill="#ea580c" text-anchor="middle" x="296" y="166">new reverse arc, g = 1/0.6</text>

    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="190" y1="134" x2="190" y2="226" marker-end="url(#h-grey)"/>

    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="70" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="70" y="185">s</text>
    <circle fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" cx="190" cy="110" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="115">a</text>
    <circle fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" cx="190" cy="250" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="255">b</text>
    <circle fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" cx="400" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="400" y="185">t</text>
    <text font-size="10px" fill="#ea580c" text-anchor="middle" font-weight="600" x="190" y="86">stale</text>
    <text font-size="10px" fill="#ea580c" text-anchor="middle" font-weight="600" x="190" y="288">stale</text>
    <text font-size="10px" fill="#ea580c" text-anchor="middle" font-weight="600" x="400" y="156">stale</text>
  </g>

  <text font-size="11.5px" fill="#334155" x="36" y="652">Only the nodes the push touched can have broken their label</text>
  <text font-size="11.5px" fill="#334155" x="36" y="670">constraint, so the repair is seeded from those and propagates</text>
  <text font-size="11.5px" fill="#334155" x="36" y="688">outward until every reduced cost is non-negative again.</text>

  <!-- ============================= PANEL 4 ============================= -->
  <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" x="500" y="368" width="464" height="336"/>
  <circle fill="#0f172a" cx="526" cy="396" r="11"/>
  <text font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle" x="526" y="400">4</text>
  <text font-size="15px" font-weight="650" fill="#0f172a" x="546" y="394">The next constriction</text>
  <text font-size="11.5px" fill="#64748b" x="546" y="410">repaired labels, so one Dijkstra finds the new best path</text>

  <g transform="translate(484,352)">
    <line stroke="#0f172a" stroke-width="3.2" fill="none" x1="96" y1="172" x2="166" y2="118" marker-end="url(#h-dark)"/>
    <text font-size="10.5px" fill="#0f172a" font-weight="650" text-anchor="middle" x="120" y="131">10 ÷ 1</text>

    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="96" y1="188" x2="166" y2="242" marker-end="url(#h-faint)"/>

    <line stroke="#dc2626" stroke-width="3.6" fill="none" x1="214" y1="110" x2="376" y2="170" marker-end="url(#h-red)"/>
    <text font-size="10.5px" fill="#dc2626" font-weight="650" text-anchor="middle" x="300" y="124">4 ÷ 1 = 4  ← least</text>

    <path stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" d="M 214 252 L 376 192" marker-end="url(#h-faint)"/>
    <line stroke="#cbd5e1" stroke-width="2" fill="none" x1="190" y1="134" x2="190" y2="226" marker-end="url(#h-grey)"/>

    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="70" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="70" y="185">s</text>
    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="190" cy="110" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="115">a</text>
    <circle fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" cx="190" cy="250" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="190" y="255">b</text>
    <circle fill="#ffffff" stroke="#0f172a" stroke-width="2.4" cx="400" cy="180" r="24"/><text font-size="13px" font-weight="650" fill="#0f172a" text-anchor="middle" x="400" y="185">t</text>
    <text font-size="10px" fill="#0369a1" text-anchor="middle" font-weight="600" x="190" y="86">repaired</text>
    <text font-size="10px" fill="#0369a1" text-anchor="middle" font-weight="600" x="400" y="156">repaired</text>
  </g>

  <text font-size="11.5px" fill="#0f172a" font-weight="650" x="520" y="652">The constriction moved to a→t, a different edge.</text>
  <text font-size="11.5px" fill="#334155" x="520" y="670">Push 4 units for 2 more at t, total 7.4. Repeat until no path</text>
  <text font-size="11.5px" fill="#334155" x="520" y="688">and no gain-amplifying cycle remain — that is the certificate.</text>

  <!-- ============================== LEGEND ============================= -->
  <g transform="translate(16,718)">
    <line stroke="#0f172a" stroke-width="3.2" fill="none" x1="4" y1="10" x2="40" y2="10" marker-end="url(#h-dark)"/>
    <text font-size="11px" fill="#475569" x="48" y="14">chosen path</text>

    <line stroke="#dc2626" stroke-width="3.6" fill="none" x1="150" y1="10" x2="186" y2="10" marker-end="url(#h-red)"/>
    <text font-size="11px" fill="#475569" x="194" y="14">constricting edge</text>

    <line stroke="#ea580c" stroke-width="2.6" fill="none" stroke-dasharray="6 4" x1="330" y1="10" x2="366" y2="10" marker-end="url(#h-orange)"/>
    <text font-size="11px" fill="#475569" x="374" y="14">reverse residual arc (g → 1/g)</text>

    <circle fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" cx="610" cy="10" r="9"/>
    <text font-size="11px" fill="#475569" x="626" y="14">label to repair</text>

    <line stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="3 3" x1="740" y1="10" x2="776" y2="10" marker-end="url(#h-faint)"/>
    <text font-size="11px" fill="#475569" x="784" y="14">saturated or unused</text>
  </g>
</svg>
