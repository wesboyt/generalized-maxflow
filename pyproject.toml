[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "generalized-maxflow"
version = "0.3.0"
description = "Generalized maximum flow: maximum flow with per-edge gain multipliers"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "wesboyt" }]
maintainers = [{ name = "wesboyt" }]
keywords = [
  "maximum-flow",
  "generalized-flow",
  "network-flow",
  "graph",
  "optimization",
  "lossy-network",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/wesboyt/generalized-maxflow"
Source = "https://github.com/wesboyt/generalized-maxflow"
Issues = "https://github.com/wesboyt/generalized-maxflow/issues"

[project.scripts]
gmaxflow = "gmaxflow.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/gmaxflow"]
# The solver is loaded with ctypes and never links libpython, so one wheel per
# OS/CPU serves every CPython (free-threaded included) and PyPy: tag it
# py3-none-<platform> instead of cpXY-cpXY-<platform>.
wheel.py-api = "py3"
wheel.license-files = ["LICENSE"]
# Everything git tracks goes in, minus what a source build does not need.
# Anchored, so a "src" inside a stray build tree is not swept in.
sdist.exclude = ["/build*", "/dist", "/wheelhouse", "/.github", "/docs", "*.egg-info",
                 "/bindings/wasm/pkg"]

[tool.scikit-build.cmake.define]
GMF_BUILD_SHARED = "ON"
GMF_BUILD_TESTS = "OFF"
GMF_BUILD_CLI = "OFF"
GMF_BUILD_BENCH = "OFF"

[tool.cibuildwheel]
# py3-none wheels are Python-independent: build each platform ONCE, then
# install that one wheel and test it.
build = "cp312-*"
skip = ["*-musllinux_i686", "*-manylinux_i686", "*-win32"]
test-requires = ["pytest"]
test-command = "pytest -q {project}/tests/test_python.py"
environment = { GMAXFLOW_TEST_INSTALLED = "1" }

[tool.cibuildwheel.macos]
# The earliest macOS each architecture supports well; widens compatibility.
environment = { GMAXFLOW_TEST_INSTALLED = "1", MACOSX_DEPLOYMENT_TARGET = "10.13" }
