name: demo

# Builds the WebAssembly solver and the browser demo on every push, and
# publishes it to GitHub Pages when run manually.
#
# To publish: enable Pages once under Settings -> Pages with the source set to
# "GitHub Actions" (a private repository needs a paid plan for this), then run
# this workflow from the Actions tab. Pushes only build, so they stay green
# whether or not Pages is on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Build the WebAssembly package
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash bindings/wasm/build.sh --test

      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/demo/index.html site/
          cp bindings/wasm/pkg/index.mjs bindings/wasm/pkg/gmaxflow.js \
             bindings/wasm/pkg/gmaxflow.wasm site/
          cp docs/algorithm-flow.svg site/
          ls -l site

      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: site

      # Publishing is opt-in: GitHub Pages has to be turned on for the
      # repository first, and it is not available for private repositories on
      # the free plan. Until then every push still builds the demo and leaves it
      # as the downloadable `demo-site` artifact above, and a push stays green.
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    name: publish to Pages
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
