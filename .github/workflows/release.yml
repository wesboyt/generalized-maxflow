name: release

# The release build: wheels for every supported platform, a source
# distribution, and the WebAssembly package. Publishing to PyPI and npm happens
# only for a published GitHub release, and only if the matching secret or
# trusted-publishing setup is in place.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-latest
            archs: aarch64
          - os: macos-latest
            archs: "x86_64 arm64"
          - os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for the cross-built Linux wheels
        if: matrix.archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist

      - name: The source distribution builds and passes its tests
        run: |
          python -m pip install --upgrade pytest
          python -m pip install dist/*.tar.gz
          python -m pytest -q tests/test_python.py

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wasm:
    name: webassembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Build and smoke-test
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash bindings/wasm/build.sh --test

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: bindings/wasm/pkg

  publish-pypi:
    name: publish to PyPI
    needs: [wheels, sdist, wasm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: publish to npm
    needs: [wasm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping the npm publish." >&2
            exit 0
          fi
          cd pkg && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  attach-to-release:
    name: attach the artifacts to the release
    needs: [wheels, sdist, wasm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Bundle the WebAssembly package
        run: |
          cd artifacts/wasm-package && zip -r ../../generalized-maxflow-wasm.zip . && cd -
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            generalized-maxflow-wasm.zip \
            artifacts/sdist/*.tar.gz \
            artifacts/wheels-*/*.whl \
            --clobber
